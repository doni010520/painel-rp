name: Build & Push Docker image

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # Lê APP_VERSION de src/lib/version.ts (ex.: v1.0.0) — é a versão que aparece
      # no topo do app e em /api/version. A imagem é taggeada com ela.
      - name: Resolve version
        id: ver
        run: |
          VERSION=$(grep -oP 'APP_VERSION\s*=\s*"\K[^"]+' src/lib/version.ts)
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "Versão: ${VERSION} | build ${{ github.run_number }} | sha ${SHORT_SHA}"

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # Sem :latest. Tags humanas e ÚNICAS para saber exatamente o que está no ar:
          #  - vX.Y.Z         → a versão (igual à mostrada no app)
          #  - build-<n>      → contador incremental, nunca sobrescreve
          #  - <short-sha>    → commit exato
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:build-${{ github.run_number }}
            ${{ env.IMAGE }}:${{ steps.ver.outputs.short_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SUPABASE_URL=https://skacswwfbbdbtabgqsqy.supabase.co
            NEXT_PUBLIC_SUPABASE_ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNrYWNzd3dmYmJkYnRhYmdxc3F5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzM2ODU5NjcsImV4cCI6MjA4OTI2MTk2N30.G4f7bqzj14MDro8RgKpqGxWIVhmZwjnI7hT_SNgZz2o
            GIT_SHA=${{ steps.ver.outputs.short_sha }}
